{{ define "main" }}
<article>
    <h1>{{ .Title }}</h1>

    {{ with $tags := .GetTerms "tags" }}
    <nav aria-label="タグ">
        <strong>タグ:</strong>
        {{ range $index, $tag := $tags }}
        {{ if $index }}, {{ end }}<a href="{{ $tag.RelPermalink }}">{{ $tag.LinkTitle }}</a>
        {{ end }}
    </nav>
    {{ end }}

    {{ .Content }}
</article>
{{ end }}
