{{ define "main" }}
<article>
    <h1>{{ .Title }}</h1>

    {{ with .Content }}
    {{ . }}
    {{ end }}

    <ul>
        {{ range .Data.Terms.ByCount }}
        <li>
            <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
            <span>({{ .Count }})</span>
        </li>
        {{ end }}
    </ul>
</article>
{{ end }}
